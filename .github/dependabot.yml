version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns: ["androidx.*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
  - package-ecosystem: gradle
    directory: /integration/consumer
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
