name: Device performance diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/device-performance.yml'
      - 'integration/consumer/benchmark/**'
      - 'integration/consumer/settings.gradle.kts'
      - 'integration/consumer/gradle/verification-metadata.xml'
      - 'integration/consumer/src/main/AndroidManifest.xml'
      - 'integration/consumer/src/main/java/com/example/consumer/BenchmarkActivity.kt'
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
concurrency:
  group: device-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-project
      - run: ./gradlew :timelineview:publishReleasePublicationToBuildRepository
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: false
          script: >-
            ./gradlew -p integration/consumer :benchmark:connectedReleaseAndroidTest
            -PtimelineBenchmarks=true
            -PtimelineRepository="$PWD/build/repository"
            -PtimelineVersion="$(sed -n 's/^version = "\([^"]*\)"/\1/p' timelineview/build.gradle.kts)"
            -Pandroid.testInstrumentationRunnerArguments.timelineSmoke=true
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
            --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-performance-diagnostics
          path: |
            integration/consumer/benchmark/build/reports/androidTests/
            integration/consumer/benchmark/build/outputs/connected_android_test_additional_output/
            integration/consumer/benchmark/build/outputs/androidTest-results/
