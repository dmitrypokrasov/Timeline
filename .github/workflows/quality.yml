name: Quality and release verification
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}-${{ inputs.ref }}
  cancel-in-progress: ${{ !inputs.release && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-project
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./gradlew qualityCheck -PskipScreenshots --continue --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            **/build/reports/
            **/build/test-results/
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-project
      - run: ./gradlew :timelineview:testDebugUnitTest --tests '*TimelineScreenshotTest' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            timelineview/build/reports/
            timelineview/build/test-results/
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-project
      - run: bash scripts/check-release.sh --package-only
        env:
          TIMELINE_RELEASE_TAG: ${{ inputs.ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: tested-maven-repository
          path: build/repository/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-and-api-reports
          path: |
            build/reports/api/
            integration/consumer/build/reports/
            integration/consumer/build/outputs/apk/
            app/build/outputs/apk/debug/
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-project
      - run: python3 scripts/check-docs.py
      - run: ./gradlew qualityDocs --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: timelineview/build/dokka/html/
          if-no-files-found: error
  devices:
    if: inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 27
            arch: x86
          - api: 34
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-project
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: true
          script: ./gradlew :timelineview:connectedDebugAndroidTest :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-${{ matrix.api }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-project
      - run: ./gradlew :timelineview:testDebugUnitTest --tests '*TimelinePerformanceTest' -PincludeBenchmarks --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: timelineview/build/reports/performance/
  required-checks:
    name: Required checks
    if: always()
    needs: [quality, screenshots, package, documentation, devices, performance]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the event's required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          DEVICES_REQUIRED: ${{ inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          PERFORMANCE_REQUIRED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          required = {'quality', 'screenshots', 'package', 'documentation'}
          if os.environ['DEVICES_REQUIRED'] == 'true': required.add('devices')
          if os.environ['PERFORMANCE_REQUIRED'] == 'true': required.add('performance')
          bad = {name: value['result'] for name, value in results.items()
                 if value['result'] != 'success' and (name in required or value['result'] != 'skipped')}
          if bad: raise SystemExit(f'Unsuccessful required checks: {bad}')
          print('All required checks passed.')
          PY
