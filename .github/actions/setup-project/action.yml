name: Set up Timeline build
description: Configure the pinned JDK, Android SDK and Gradle cache
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        # Override the action's obsolete default "tools platform-tools" package list.
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
    - name: Validate wrapper distribution checksum
      shell: bash
      run: python3 scripts/check-wrapper.py
