name: Set up Timeline build
description: Configure the pinned JDK, Android SDK and Gradle cache
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # Override the action's obsolete default "tools platform-tools" package list.
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 build-tools;36.0.0'
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - name: Validate wrapper distribution checksum
      shell: bash
      run: python3 scripts/check-wrapper.py
